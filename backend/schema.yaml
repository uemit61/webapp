components:
  schemas:
    APIError:
      type: object
      properties:
        detail:
          type: string
          description: Fehlermeldung
      required:
      - detail
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        permissions:
          type: array
          items:
            type: integer
      required:
      - id
      - name
    PatchedGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        permissions:
          type: array
          items:
            type: integer
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: string
        emailVerified:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
    PatchedRegistration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        signature:
          type: string
          writeOnly: true
        signature_bondsman:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        name_bondsman:
          type: string
          maxLength: 50
        street:
          type: string
          maxLength: 100
        house_number:
          type: string
          maxLength: 10
        zip:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 50
        date_of_birth:
          type: string
          format: date
        date_of_registration:
          type: string
          format: date
        phone:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        email:
          type: string
          format: email
        profile:
          $ref: '#/components/schemas/Profile'
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: string
        emailVerified:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
      required:
      - createdAt
      - emailVerified
      - id
      - updatedAt
      - user
    Registration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        signature:
          type: string
          writeOnly: true
        signature_bondsman:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        name_bondsman:
          type: string
          maxLength: 50
        street:
          type: string
          maxLength: 100
        house_number:
          type: string
          maxLength: 10
        zip:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 50
        date_of_birth:
          type: string
          format: date
        date_of_registration:
          type: string
          format: date
        phone:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - city
      - created_at
      - email
      - first_name
      - house_number
      - id
      - name_bondsman
      - phone
      - street
      - zip
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - ausstehend
        * `approved` - genehmigt
        * `rejected` - abgelehnt
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        email:
          type: string
          format: email
        profile:
          $ref: '#/components/schemas/Profile'
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - email
      - id
      - profile
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
