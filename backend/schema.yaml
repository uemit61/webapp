openapi: 3.0.3
info:
  title: Rounders Card Club API
  version: 1.0.0
  description: Beispiel mit drf-spectacular
paths:
  /api/group/:
    get:
      operationId: api_group_list
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
          description: ''
    post:
      operationId: api_group_create
      tags:
      - api
      requestBody:
